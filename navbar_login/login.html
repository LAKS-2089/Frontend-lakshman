

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Login Signup</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">


    <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }


        .navbar {
            background: #172554;
            padding: 15px 0;
        }


        .navbar-brand {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }


        .navbar-brand:hover {
            color: #93c5fd;
        }


        .navbar .nav-link {
            color: white;
            margin: 0 10px;
        }


        .navbar .nav-link:hover {
            color: #93c5fd;
        }


        .btn-login {
            border: 1px solid white;
            color: white;
        }


        .btn-login:hover {
            background: white;
            color: #172554;
        }


        .btn-signup {
            background: #2563eb;
            color: white;
        }


        .btn-signup:hover {
            background: #1d4ed8;
            color: white;
        }


        .modal-header {
            background: #172554;
            color: white;
        }


        .modal-header .btn-close {
            filter: invert(1);
        }


        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px #93c5fd;
        }


        .welcome {
            text-align: center;
            margin-top: 120px;
        }


        .welcome h1 {
            color: #172554;
            font-weight: bold;
        }
    </style>
</head>


<body>


    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">


            <a class="navbar-brand" href="#">
                <i class="bi bi-code-slash"></i> MyWebsite
            </a>


            <button class="navbar-toggler bg-light" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarMenu">


                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>


                    <!-- LOGIN BUTTON -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-login w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#loginModal">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                        </button>
                    </li>


                    <!-- SIGNUP BUTTON -->
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <button class="btn btn-signup w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#signupModal">
                            <i class="bi bi-person-plus-fill"></i>
                            Sign Up
                        </button>
                    </li>
                </ul>


            </div>
        </div>
    </nav>




    <!-- HOME CONTENT -->
    <div class="container welcome">
        <h1>Welcome to MyWebsite!</h1>
        <p class="text-secondary">
            Learn, explore, and build your future with us.
        </p>


        <button class="btn btn-primary mt-3"
                data-bs-toggle="modal"
                data-bs-target="#signupModal">
            Get Started <i class="bi bi-arrow-right"></i>
        </button>
    </div>




    <!-- LOGIN MODAL -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">


                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-circle"></i> Login
                    </h5>


                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>


                <div class="modal-body p-4">
                    <form id="loginForm">


                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">
                                Email Address
                            </label>
                            <input type="email" class="form-control"
                                   id="loginEmail"
                                   placeholder="Enter your email"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control"
                                   id="loginPassword"
                                   placeholder="Enter your password"
                                   required>
                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                        </button>


                    </form>
                </div>


            </div>
        </div>
    </div>




    <!-- SIGNUP MODAL -->
    <div class="modal fade" id="signupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">


                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus-fill"></i> Create Account
                    </h5>


                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>


                <div class="modal-body p-4">
                    <form id="signupForm">


                        <div class="mb-3">
                            <label for="signupName" class="form-label">
                                Full Name
                            </label>
                            <input type="text" class="form-control"
                                   id="signupName"
                                   placeholder="Enter your full name"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label for="signupEmail" class="form-label">
                                Email Address
                            </label>
                            <input type="email" class="form-control"
                                   id="signupEmail"
                                   placeholder="Enter your email"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label for="signupPassword" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control"
                                   id="signupPassword"
                                   placeholder="Create a password"
                                   minlength="8"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>
                            <input type="password" class="form-control"
                                   id="confirmPassword"
                                   placeholder="Re-enter your password"
                                   minlength="8"
                                   required>
                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">
                            <i class="bi bi-person-check-fill"></i>
                            Create Account
                        </button>


                    </form>
                </div>


            </div>
        </div>
    </div>




    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- CUSTOM JAVASCRIPT -->
    <script>
        // LOGIN FORM
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {


                event.preventDefault();


                const email = document.getElementById("loginEmail").value;
                const password = document.getElementById("loginPassword").value;


                console.log("LOGIN FORM SUBMITTED");
                console.log("Email:", email);
                console.log("Password entered:", password.length > 0);


                alert("Login form submitted! Check the console.");


                this.reset();


                bootstrap.Modal.getInstance(
                    document.getElementById("loginModal")
                ).hide();
            });




        // SIGNUP FORM
        document.getElementById("signupForm")
            .addEventListener("submit", function(event) {


                event.preventDefault();


                const name = document.getElementById("signupName").value;
                const email = document.getElementById("signupEmail").value;
                const password = document.getElementById("signupPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;


                // Check whether passwords match
                if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }


                console.log("SIGNUP FORM SUBMITTED");
                console.log("Name:", name);
                console.log("Email:", email);
                console.log("Password entered:", password.length > 0);
                console.log("Passwords match:", password === confirmPassword);


                alert("Signup successful! Check the console.");


                this.reset();


                bootstrap.Modal.getInstance(
                    document.getElementById("signupModal")
                ).hide();
            });
    </script>


</body>
</html>
